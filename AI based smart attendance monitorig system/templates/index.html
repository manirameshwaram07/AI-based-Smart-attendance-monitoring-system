<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Smart Attendance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f3f6f9;
        color: #1f2937;
      }

      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px;
      }

      h1 {
        margin-bottom: 24px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
        margin-bottom: 28px;
      }

      .card {
        background: white;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        padding: 22px;
      }

      .label {
        color: #64748b;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .metric {
        font-size: 2.1rem;
        font-weight: 700;
        margin-top: 12px;
        color: #111827;
      }

      .alert {
        font-weight: 700;
        color: #dc2626;
      }

      .panel {
        background: white;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        padding: 16px 20px;
      }

      canvas {
        max-height: 300px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Smart Attendance Analytics Console</h1>

      <div class="grid">
        <div class="card">
          <div class="label">Attendance Rate</div>
          <div id="rate" class="metric">--</div>
        </div>
        <div class="card">
          <div class="label">Punctuality Score</div>
          <div id="punctuality" class="metric">--</div>
        </div>
        <div class="card">
          <div class="label">At-Risk Alerts</div>
          <div id="risk_users" class="metric alert">--</div>
        </div>
      </div>

      <div class="panel">
        <canvas id="attendanceChart"></canvas>
      </div>
    </div>

    <script>
      async function fetchAnalytics() {
        const response = await fetch('/api/analytics/dashboard');
        const data = await response.json();

        if (data.summary_kpis) {
          document.getElementById('rate').innerText = data.summary_kpis.overall_attendance_rate || '--';
          document.getElementById('punctuality').innerText = data.summary_kpis.punctuality_rate || '--';

          const atRisk = data.risk_predictions && data.risk_predictions.at_risk_user_ids ? data.risk_predictions.at_risk_user_ids : [];
          document.getElementById('risk_users').innerText = atRisk.length > 0 ? `${atRisk.length} flagged` : 'None';
        }

        const labels = ['Present', 'Late', 'Absent'];
        const summary = data.summary_kpis || {};
        const attendanceValues = [
          Number(String(summary.overall_attendance_rate || '0').replace('%', '')) || 0,
          Number(String(summary.punctuality_rate || '0').replace('%', '')) || 0,
          Math.max(0, 100 - (Number(String(summary.overall_attendance_rate || '0').replace('%', '')) || 0)),
        ];

        if (window.attendanceChartInstance) {
          window.attendanceChartInstance.destroy();
        }

        window.attendanceChartInstance = new Chart(document.getElementById('attendanceChart'), {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              label: 'Performance Index',
              data: attendanceValues,
              backgroundColor: ['#10b981', '#f59e0b', '#ef4444']
            }]
          },
          options: {
            responsive: true,
            scales: {
              y: { beginAtZero: true, max: 100 }
            }
          }
        });
      }

      fetchAnalytics();
      setInterval(fetchAnalytics, 30000);
    </script>
  </body>
</html>
